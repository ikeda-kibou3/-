<!doctype html><html lang="ja"><meta charset="utf-8"><title>法人ログイン</title>
<body><h1>法人ログイン</h1>
<p><label for="uid">利用者識別番号</label><input id="uid" name="riyousyaId" type="text"></p>
<p><label for="pw">暗証番号</label><input id="pw" name="password" type="password"></p>
<button type="button" onclick="doLogin()">ログイン</button>
<p id="err" style="color:red"></p>
<script>
function doLogin(){
  var u=document.getElementById('uid').value, p=document.getElementById('pw').value;
  if(u==='1234567890123456' && p==='正しい暗証番号'){ location.href='confirm.html'; }
  else { document.getElementById('err').textContent='暗証番号が誤っています。'; }
}
</script></body></html>
