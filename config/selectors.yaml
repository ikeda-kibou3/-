# =====================================================================
#  e-Tax 画面の「部品の探し方」定義
#
#  ここが RPA でいう「画像認識」に当たる部分です。ただし画像ではなく
#  画面上の文字（ラベル）で探すので、レイアウトが多少変わっても壊れません。
#
#  各ステップには候補を上から順に書きます。上から順に試し、
#  最初に見つかったものを使います。1つ壊れても次の候補で動きます。
#
#  書き方は3種類:
#    - {text: "ログイン"}            … その文字を含むリンク/ボタンを探す
#    - {label: "利用者識別番号"}      … その見出しが付いた入力欄を探す
#    - {css: "#userId"}              … CSSセレクタで直接指す（最後の手段）
#
#  ★ e-Tax は予告なく画面が変わります。動かなくなったら
#     `etax-auto capture` で今の画面を保存し、ここを直してください。
#     詳しくは docs/04_セレクタの調べ方と直し方.md
# =====================================================================

# --- ① トップページ → ログイン -------------------------------------
login_entry:
  - {text: "ログイン"}
  - {css: "a[href*='login']"}

# --- ② 「法人」を選択 ----------------------------------------------
select_corporation:
  - {text: "法人"}
  - {text: "法人ログイン"}

# --- ③ 利用者識別番号・暗証番号の入力 -------------------------------
user_id_input:
  - {label: "利用者識別番号"}
  - {css: "input[name*='riyousya']"}
  - {css: "input[name*='userId']"}

password_input:
  - {label: "暗証番号"}
  - {label: "パスワード"}
  - {css: "input[type='password']"}

login_submit:
  - {text: "ログイン"}
  - {css: "button[type='submit']"}
  - {css: "input[type='submit']"}

# --- ④ ログイン直後に出る確認ダイアログ（「はい」） -------------------
after_login_confirm:
  - {text: "はい"}
  - {text: "OK"}
  - {text: "次へ"}

# --- ⑤ 送信結果・お知らせ -------------------------------------------
message_box:
  - {text: "送信結果・お知らせ"}
  - {text: "メッセージボックス"}

notice_folder:
  - {text: "お知らせ・受信通知"}
  - {text: "通知書等一覧"}

# --- ⑥ お知らせ一覧の行（タイトルのリンク） --------------------------
# 行の探索は etax.py がタイトル文字列で行うので、ここは一覧表の指定のみ
notice_table:
  - {css: "table"}

# --- ⑦ 「お知らせの内容を確認する」 ----------------------------------
open_notice_body:
  - {text: "お知らせの内容を確認する"}
  - {text: "内容を確認"}

# --- ⑧ PDF のダウンロード／印刷 --------------------------------------
# ここで見つからなくても、ブラウザの印刷機能でPDF化するので処理は続きます。
# 「印刷」ボタンは印刷ダイアログが開いて処理が止まることがあるため入れていません。
download_pdf:
  - {text: "帳票表示・印刷"}
  - {text: "PDFダウンロード"}
  - {text: "ダウンロード"}

# --- ⑨ 戻る --------------------------------------------------------
back_button:
  - {text: "戻る"}

# --- ⑩ ログアウト ---------------------------------------------------
logout:
  - {text: "ログアウト"}
