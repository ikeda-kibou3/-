# =====================================================================
#  etax-auto 設定ファイル
#  ここだけ直せば、事務所ごとの運用に合わせられます。
# =====================================================================

[general]
# 事務所名（出力フォルダ名やレポートに使います）
office_name = "池田税理士事務所"
# 出力先フォルダ
output_dir  = "out"
log_dir     = "logs"

[schedule]
# 実行月の「翌月」に申告月が来る関与先を対象にします。
#   例) 4月に実行 → 申告月5月 → 3月決算の関与先が対象
# 何か月先の申告月を対象にするか（通常は 1 = 翌月）
months_ahead = 1
# 法人税の法定申告期限（決算月の何か月後か）
corp_tax_months_after_close = 2
# 消費税の法定申告期限（決算月の何か月後か）
consumption_tax_months_after_close = 2

[etax]
# e-Tax 受付システムのログイン開始URL。
# ★実際にお使いのURLをブラウザのアドレスバーからコピーして貼り替えてください。
login_url = "https://www.e-tax.nta.go.jp/"
# 1社あたりの最大待ち時間（秒）
timeout_sec = 60
# 社と社の間に空ける秒数（サーバに負荷をかけないための間隔。0にしないでください）
interval_sec = 5
# ログイン失敗時のリトライ回数
max_retry = 2
# true にするとブラウザ画面を表示します（初回や不具合調査時は必ず true）
headful = true
# 画面が想定と違ったとき、閉じずに一時停止して人の操作を待つ
manual_assist = true

[notices]
# 取得対象の「お知らせ」タイトル（部分一致・正規表現）
corp_tax_pattern        = "法人税及び地方法人税.*確定申告"
consumption_tax_pattern = "消費税及び地方消費税.*確定申告"

[pages]
# 印刷に使うページ（1始まり）。手順書どおり、消費税は1ページ目のみ。
corp_tax_pages        = [1]
consumption_tax_pages = [1]

[highlight]
# この語の右側にある金額を自動で蛍光ペン（黄色ハイライト）にします。
# 実際の通知書の文言に合わせて増減してください。
keywords = [
    "納付すべき税額",
    "中間申告分の納付税額",
    "予定納税額",
    "納付税額",
    "税額",
]
enabled = true

[bundle]
# ①②③(a)(b) の順に1本のPDFへ束ねる（これ1つを片面印刷すれば完成）
enabled = true
filename = "_束ね.pdf"
