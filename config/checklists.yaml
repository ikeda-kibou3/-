# =====================================================================
#  チェックリストの差し込み設定
#
#  紙の原本をスキャンして templates/ に PDF で置き、
#  「どこに何を印字するか」をここで指定します。
#
#  座標は PDF の左下が原点、単位はポイント（1pt = 1/72インチ）。
#  A4縦なら 幅595 x 高842、A4横なら 幅842 x 高595 です。
#
#  座標が分からないときは方眼を重ねた確認用PDFを作れます:
#      etax-auto calibrate templates/01_法人税消費税チェックリスト.pdf
#
#  差し込める値:
#    {法人名} {決算期間} {決算期首} {決算期末} {担当者} {関与先コード}
#    {申告年月} {事務所} {作成日}
# =====================================================================

checklists:
  # ① 法人税・消費税チェックリスト（A4縦）
  - id: "01"
    name: "法人税・消費税チェックリスト"
    template: "templates/01_法人税消費税チェックリスト.pdf"
    output: "01_法人税消費税チェックリスト.pdf"
    # この帳票は常に付ける
    when: "always"
    fields:
      - {page: 1, x: 120, y: 760, size: 12, text: "{法人名}"}
      - {page: 1, x: 120, y: 735, size: 10, text: "{決算期間}"}
      - {page: 1, x: 430, y: 760, size: 10, text: "{担当者}"}
    # 消費税申告がある会社だけ、該当欄に○を打つ
    marks:
      - {page: 1, x: 300, y: 700, size: 14, text: "○", when: "consumption"}

  # ② 法人税チェックリスト（A4横）
  - id: "02"
    name: "法人税チェックリスト"
    template: "templates/02_法人税チェックリスト.pdf"
    output: "02_法人税チェックリスト.pdf"
    when: "corp"
    fields:
      - {page: 1, x: 100, y: 540, size: 12, text: "{法人名}"}
      - {page: 1, x: 420, y: 540, size: 10, text: "{決算期間}"}
      - {page: 1, x: 700, y: 540, size: 10, text: "{担当者}"}

  # ③ 消費税チェックリスト（A4横）
  - id: "03"
    name: "消費税チェックリスト"
    template: "templates/03_消費税チェックリスト.pdf"
    output: "03_消費税チェックリスト.pdf"
    when: "consumption"
    fields:
      - {page: 1, x: 100, y: 540, size: 12, text: "{法人名}"}
      - {page: 1, x: 420, y: 540, size: 10, text: "{決算期間}"}
      - {page: 1, x: 700, y: 540, size: 10, text: "{担当者}"}
